spring.application.name=similar-products
# The port the brief and its k6 test expect.
server.port=5000
# Tomcat serves each request on a virtual thread too, so 200 concurrent users do not queue.
spring.threads.virtual.enabled=true

existing.api.base-url=${EXISTING_API_BASE_URL:http://localhost:3001}
existing.api.connect-timeout=1000ms
# The mocks answer in up to 50 s; past 2 s a similar product is not worth waiting for.
existing.api.read-timeout=2000ms

# One breaker for both endpoints: they are the same upstream service.
resilience4j.circuitbreaker.instances.existingApi.sliding-window-size=10
resilience4j.circuitbreaker.instances.existingApi.minimum-number-of-calls=5
resilience4j.circuitbreaker.instances.existingApi.failure-rate-threshold=80
resilience4j.circuitbreaker.instances.existingApi.wait-duration-in-open-state=2s
resilience4j.circuitbreaker.instances.existingApi.permitted-number-of-calls-in-half-open-state=3
resilience4j.circuitbreaker.instances.existingApi.ignore-exceptions=com.itx.similarproducts.domain.exception.ProductNotFoundException
