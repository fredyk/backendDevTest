spring.application.name=similar-products
# The port the brief and its k6 test expect.
server.port=5000
# Tomcat serves each request on a virtual thread too, so 200 concurrent users do not queue.
spring.threads.virtual.enabled=true

existing.api.base-url=${EXISTING_API_BASE_URL:http://localhost:3001}
existing.api.connect-timeout=1000ms
# The mocks answer in up to 50 s; past 2 s a similar product is not worth waiting for.
existing.api.read-timeout=2000ms
# Short enough that a price or stock change shows up within seconds, long enough to absorb a traffic burst.
existing.api.cache-ttl=5s

# Breakers are created per product and endpoint at runtime, so they all take the default config.
resilience4j.circuitbreaker.configs.default.sliding-window-size=10
resilience4j.circuitbreaker.configs.default.minimum-number-of-calls=5
resilience4j.circuitbreaker.configs.default.failure-rate-threshold=80
resilience4j.circuitbreaker.configs.default.wait-duration-in-open-state=2s
resilience4j.circuitbreaker.configs.default.permitted-number-of-calls-in-half-open-state=3
resilience4j.circuitbreaker.configs.default.ignore-exceptions=com.itx.similarproducts.domain.exception.ProductNotFoundException

# Health for the container check; metrics include the per-product circuit breaker states.
management.endpoints.web.exposure.include=health,metrics
